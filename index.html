<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="/output.css" rel="stylesheet">
  <title>Tailwind Toggle - Image Fixed</title>
</head>

<body class="flex items-center justify-center min-h-screen bg-[#050D24]">
  <label class="relative inline-block w-[60px] h-[33px]">
    <input type="checkbox" class="peer sr-only" />
    <span
      class="
        absolute inset-0 cursor-pointer
        bg-[#050D24]
        border-[4px] border-gray-800
        rounded-full
        transition-colors duration-300

        peer-checked:bg-[#06B050]

        before:content-['']
        before:absolute
        before:h-[33px]
        before:w-[33px]
        before:rounded-full
        
        /* 1. Moved color here and added bg-no-repeat */
        before:bg-[#06B050]
        before:bg-no-repeat
        
        /* 2. Added Knob Border */
        before:border-[4px] before:border-[#050D24]
        before:box-border

        /* 3. Encoded spaces in URL for better compatibility */
        before:bg-[url('/WhatsApp%20Image%202026-01-28%20at%201.45.39%20PM.jpeg')]
        before:bg-cover
        before:bg-center
        before:left-[-4px]
        before:top-[-4px]
        before:transition-all
        before:duration-300
        before:shadow-md
        before:z-10

        peer-checked:before:translate-x-[32px]
        /* 4. Encoded spaces in URL here too */
        peer-checked:before:bg-[url('/WhatsApp%20Image%202026-01-28%20at%201.45.40%20PM.jpeg')]
      "
    ></span>
  </label>
</body>
</html>
