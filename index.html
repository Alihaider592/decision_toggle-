<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="/output.css" rel="stylesheet">
  <title>Tailwind Toggle - Custom Border Color</title>
</head>

<body class="flex items-center justify-center min-h-screen bg-[#050D24]">
  <label class="relative inline-block w-[60px] h-[33px]">
    <input type="checkbox" class="peer sr-only" />
    <span
      class="
        absolute inset-0 cursor-pointer
        bg-[#050D24]
        border-[4px] border-gray-800
        rounded-full
        transition-colors duration-300

        peer-checked:bg-[#06B050]

        before:content-['']
        before:absolute
        before:h-[33px]
        before:w-[33px]
        before:rounded-full
        before:bg-[#06B050]
        
        /* THE SPECIFIC BORDER COLOR ADDED HERE */
        before:border-[3px] before:border-[#050D24]
        before:box-border

        before:bg-[url('WhatsApp_Image_2026-01-28_at_1.45.39_PM.jpeg')]
        before:bg-cover
        before:bg-center
        before:left-[-3px]
        before:top-[-4px]
        before:transition-all
        before:duration-300
        before:shadow-md
        before:z-10

        peer-checked:before:translate-x-[32px]
        peer-checked:before:bg-[url('WhatsApp_Image_2026-01-28_at_1.45.40_PM.jpeg')]
      "
    ></span>
  </label>
</body>
</html>
