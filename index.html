<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="/output.css" rel="stylesheet">
  <title>Tailwind Toggle</title>
</head>

<body class="flex items-center justify-center min-h-screen bg-gray-100 gap-6 bg-[#050D24]">
  <label class="relative inline-block w-[60px] h-[33px]">
    <input type="checkbox" class="peer sr-only" />
    <span
      class="
        absolute inset-0 cursor-pointer
        bg-[#050D24]
        border-[4px] border-gray-800
        rounded-full
        transition-colors duration-300

        peer-checked:bg-[#06B050]

        before:content-['']
        before:absolute
        before:h-[33px]
        before:w-[33px]
        before:rounded-full
        before:bg-[#06B050]
        before:bg-[url('https://placehold.co/34x34/4ade80/000000?text=Man')]
        before:bg-cover
        before:bg-center
        before:left-[-3px]
        before:top-[-3px]
        before:transition-transform
        before:duration-300
        before:shadow-md
        before:z-10

        peer-checked:before:translate-x-[32px]
        peer-checked:before:bg-[url('https://placehold.co/34x34/4ade80/000000?text=Girl')]
      "
    ></span>
  </label>
</body>
</html>
