<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold Border Toggle</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
        }

        /* The Switch Container */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        /* Hide default checkbox */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* The Track */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #001f3f; /* Dark Blue */
            
            /* Bold Border Added Here */
            border: 3px solid #000; 
            box-sizing: border-box;
            
            transition: .4s;
            border-radius: 34px;
        }

        /* The Knob (The Circle) */
        .slider:before {
            position: absolute;
            content: "";
            height: 34px; 
            width: 34px; 
            background-color: #4ade80;
            
            /* IMAGE ADDED HERE: Default Man Image */
            background-image: url('https://placehold.co/34x34/4ade80/000000?text=Man');
            background-size: cover;
            background-position: center;
            
            /* Adjusted to overlap the bold border perfectly */
            left: -3px;    
            top: -3px;     
            
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 2px 4px rgba(100,100,100,0.2);
            z-index: 2;
        }

        /* Track color when ON (Green) */
        input:checked + .slider {
            background-color: #4ade80;
        }

        /* Knob movement - shifted to account for the border thickness */
        input:checked + .slider:before {
            transform: translateX(32px);
            
            /* IMAGE ADDED HERE: Toggle Girl Image */
            background-image: url('https://placehold.co/34x34/4ade80/000000?text=Girl');
        }
    </style>
</head>
<body>

    <label class="switch">
        <input type="checkbox">
        <span class="slider"></span>
    </label>

</body>
</html>
